# ============================================================
# 十类词表（任务书规定，不得更改）
# names 的顺序 = 导出 YOLO txt 时的类别编号 0~9
# 一旦改动顺序，预标注 / 标注 / 训练 三处的类别就会全部错位
# ============================================================
names:
  - person
  - chair
  - dining table
  - couch
  - tv
  - laptop
  - cup
  - bottle
  - potted plant
  - bed

# 中文名，只用于界面显示，不参与训练
zh:
  - 人
  - 椅子
  - 桌子
  - 沙发
  - 电视
  - 笔记本电脑
  - 杯子
  - 瓶子
  - 盆栽
  - 床

# COCO 预训练模型内部的类别编号
# 说明：yolo26n-seg 是在 COCO 80 类上训练的，它输出的编号是 COCO 编号，
#      不是我们的 0~9。预标注时按这张表把 COCO 编号翻译成我们的编号。
coco_id: [0, 56, 60, 57, 62, 63, 41, 39, 58, 59]

# 图片规格（任务书第二部分「数据要求」）
image:
  max_side: 960
  jpeg_quality: 85
