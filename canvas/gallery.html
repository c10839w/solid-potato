<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片墙 · 人机协同图像标注系统</title>
<link rel="stylesheet" href="/static/scrapbook.css">
<style>
.wall-head {
  max-width: 1180px; margin: 0 auto; padding: 34px 22px 8px;
  display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap;
}
.wall-head h1 { font-size: 32px; margin: 0; }
.wall-head .sub { color: var(--ink-3); font-size: 13px; padding-bottom: 6px; }

.filters {
  max-width: 1180px; margin: 16px auto 0; padding: 0 22px;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.chipbtn {
  padding: 6px 14px; border-radius: 999px; cursor: pointer;
  border: 1.6px solid var(--line-2); background: #fff; font: inherit; font-size: 13px;
  color: var(--ink-2); box-shadow: var(--shadow-s);
}
.chipbtn:hover { transform: translateY(-1px); }
.chipbtn.on { background: var(--pink-l); border-color: var(--pink-d); color: var(--ink); font-weight: 700; }
.filters .spacer { flex: 1; }

.grid {
  max-width: 1180px; margin: 0 auto; padding: 22px 22px 60px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 22px;
}

.shot {
  position: relative; background: #fff; padding: 10px 10px 40px;
  border: 2px dashed var(--line); border-radius: 14px;
  box-shadow: var(--shadow-m); cursor: pointer;
  transition: transform .16s, box-shadow .16s;
}
.shot:nth-child(3n) { transform: rotate(-.6deg); }
.shot:nth-child(3n+1) { transform: rotate(.5deg); }
.shot:hover { transform: translateY(-4px) rotate(0); box-shadow: var(--shadow-l); z-index: 2; }
.shot img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: var(--paper-2); }
.shot .cap {
  position: absolute; left: 12px; right: 12px; bottom: 9px;
  display: flex; justify-content: space-between; gap: 8px;
  font-size: 12px; color: var(--ink-2);
}
.shot .cap b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot .badge {
  position: absolute; top: 16px; right: 16px;
  font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
  background: rgba(255, 255, 255, .92); border: 1.4px solid var(--line-2);
}
.shot .badge.human { background: var(--pink-l); border-color: var(--pink-d); color: #b4667f; }

.empty { max-width: 1180px; margin: 0 auto; padding: 40px 22px 80px; color: var(--ink-3); }

/* 大图预览 */
.lightbox {
  position: fixed; inset: 0; z-index: 99; display: none;
  place-items: center; background: rgba(74, 59, 54, .55); padding: 20px;
}
.lightbox.show { display: grid; }
.lightbox .frame {
  background: #fff; padding: 12px 12px 46px; border-radius: 16px;
  border: 2px dashed var(--line-2); box-shadow: var(--shadow-l);
  max-width: min(1000px, 94vw); max-height: 92vh; position: relative;
}
.lightbox img { max-height: 74vh; width: auto; border-radius: 8px; }
.lightbox .info { position: absolute; left: 14px; right: 14px; bottom: 12px; font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; }
.lightbox .close { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-2); background: #fff; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="brand"><span class="win-dots"><i></i><i></i><i></i></span> 标注手帐</div>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/workbench">标注工作台</a>
    <a href="/gallery" class="on">照片墙</a>
    <a href="/tracking">人员打卡</a>
    <a href="/report">对比报告</a>
  </div>
</nav>

<div class="wall-head">
  <h1>照片墙</h1>
  <span class="sub" id="wallSub">正在数……</span>
  <span class="sub" style="margin-left:auto">类别是按图里有什么物体自动猜的，可在工作台改</span>
</div>

<div class="filters" id="filters">
  <button class="chipbtn on" data-cat="all">全部</button>
  <button class="chipbtn" data-cat="客厅">客厅</button>
  <button class="chipbtn" data-cat="卧室">卧室</button>
  <button class="chipbtn" data-cat="餐厅">餐厅</button>
  <button class="chipbtn" data-cat="书房">书房</button>
  <button class="chipbtn" data-cat="其他">其他</button>
  <span class="spacer"></span>
  <button class="chipbtn" id="btnAnnotated">只看标注过的</button>
  <button class="btn primary" id="btnExportImg">导出已标注照片（ZIP）</button>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">这个类别下还没有照片。</div>

<div class="lightbox" id="lightbox">
  <div class="frame">
    <button class="close" id="btnClose">×</button>
    <img id="lbImg" alt="">
    <div class="info">
      <span id="lbName"></span>
      <span id="lbMeta"></span>
    </div>
  </div>
</div>

<script src="/static/gallery.js"></script>
</body>
</html>
