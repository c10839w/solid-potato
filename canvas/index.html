<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标注工作台 · 人机协同图像标注系统</title>
<link rel="stylesheet" href="/static/scrapbook.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="workbench">

<nav class="nav compact">
  <div class="brand"><span class="win-dots"><i></i><i></i><i></i></span> 标注手帐</div>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/workbench" class="on">标注工作台</a>
    <a href="/gallery">照片墙</a>
    <a href="/report">对比报告</a>
  </div>
</nav>

<div class="app">

  <aside class="sidebar">
    <div class="up-box">
      <button id="btnUpload" class="btn primary upload">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 11V3M4.5 6.5L8 3l3.5 3.5"/><path d="M2.5 11.5v1.5h11v-1.5"/>
        </svg>
        上传照片并识别
      </button>
      <input type="file" id="fileUpload" accept="image/*" hidden>
      <label class="cat-pick">
        照片类别
        <select id="catSel">
          <option>客厅</option><option>卧室</option><option>餐厅</option>
          <option>书房</option><option>其他</option>
        </select>
      </label>
    </div>

    <div class="side-head">
      <span>照片</span>
      <span class="muted" id="imgCount">0 张</span>
    </div>
    <div class="chips" id="chips">
      <button class="chipbtn on" data-cat="all">全部</button>
      <button class="chipbtn" data-cat="客厅">客厅</button>
      <button class="chipbtn" data-cat="卧室">卧室</button>
      <button class="chipbtn" data-cat="餐厅">餐厅</button>
      <button class="chipbtn" data-cat="书房">书房</button>
    </div>
    <ul class="img-list" id="imgList"></ul>
  </aside>

  <main class="main">
    <header class="toolbar">
      <div class="modes" id="modes">
        <button class="mode" data-mode="det">目标检测</button>
        <button class="mode active" data-mode="seg">实例分割</button>
        <button class="mode" data-mode="sem">语义分割</button>
      </div>
      <div class="spacer"></div>
      <button id="btnAdd" class="btn">新增物体</button>
      <button id="btnPrelabel" class="btn">预标注本张</button>
      <button id="btnPrelabelAll" class="btn">预标注全部</button>
      <button id="btnExportImg" class="btn">导出标注照片</button>
      <button id="btnExport" class="btn">导出数据集</button>
      <button id="btnSave" class="btn primary">保存</button>
    </header>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">左侧选一张照片开始；或用上方「上传照片并识别」</div>
      <div class="progress" id="progress" style="display:none">
        <div class="bar"><i id="barFill"></i></div>
        <span id="progressText"></span>
      </div>
    </div>

    <footer class="statusbar">
      <span id="status">—</span>
      <span class="spacer"></span>
      <span id="fixInfo" class="muted">修正记录 0 条</span>
    </footer>
  </main>

  <aside class="panel">
    <div class="panel-block">
      <h3>当前物体</h3>
      <div id="objBox" class="muted">没有选中物体</div>
      <div class="row" id="classRow" style="display:none">
        <label>类别</label>
        <select id="classSel"></select>
      </div>
      <div class="row" id="delRow" style="display:none">
        <button id="btnDel" class="btn danger">删除这个物体</button>
      </div>
    </div>

    <div class="panel-block">
      <h3>物体列表</h3>
      <ul class="obj-list" id="objList"></ul>
    </div>

    <div class="panel-block">
      <h3>操作说明</h3>
      <ul class="tips" id="tips"></ul>
    </div>
  </aside>

</div>
<script src="/static/app.js"></script>
</body>
</html>
